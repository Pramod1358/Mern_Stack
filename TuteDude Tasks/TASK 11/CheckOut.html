      <main>
                <section id="checkout" class="checkout">
                    <div class="container">
                        <div class="ch-left">
                            <h3>Checkout</h3>
                            <div class="ch-left-form">
                                <h2>Conatct Details</h2>
                                <form  class="dw">
                                    <div class="ch-left-fh">
                                        <h3>Email</h3>
                                        <input type="email" placeholder="Enter your email"/>
                                    </div>
                                    <div class="ch-left-sh">
                                        <h3>Payment</h3>
                                        <div class="payment">

                                            <div class="payment-methods">

                                                <label class="payment-option">
                                                    <input type="radio" name="payment" value="card" checked>
                                                    <div class="payment-box">
                                                        <i class="fa-regular fa-credit-card"></i>
                                                        <span>💳 Card</span>
                                                    </div>
                                                </label>

                                                <label class="payment-option">
                                                    <input type="radio" name="payment" value="crypto">
                                                    <div class="payment-box">
                                                        <i class="fa-brands fa-bitcoin"></i>
                                                        <span>₿ Crypto</span>
                                                    </div>
                                                </label>

                                                <label class="payment-option">
                                                    <input type="radio" name="payment" value="bank">
                                                    <div class="payment-box">
                                                        <i class="fa-solid fa-building-columns"></i>
                                                        <span>🏦 Bank</span>
                                                    </div>
                                                </label>

                                                <label class="payment-option">
                                                    <input type="radio" name="payment" value="more">
                                                    <div class="payment-box more">
                                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                                         <span>⋮</span>
                                                    </div>
                                                </label>

                                            </div>
                                               
                                            <div class="card-number">
                                                <p>Card Number</p>
                                                <input type="number" placeholder="Enter Card Number" maxlength="10"/>
                                            </div>


                                            <div class="payment-grid">
                                                <div class="payment-grid-content">
                                                    <label for="expiry">Expiry Date</label><br/>
                                                    <input type="text" id="expiry" name="expiry"  placeholder="MM/YY" maxlength="5"inputmode="numeric">
                                                </div>
                                                <div class="payment-grid-content">
                                                      <p for="cvv">CVC</p>
                                                    <input type="password" id="cvv" name="cvv" maxlength="3" inputmode="numeric" placeholder="CVV">
                                                </div>
                                                <div class="payment-grid-content">
                                                     <p>Country</p>
                                                 <input type="text" id="country" name="Country"  placeholder="Enter Country" >
                                                </div>
                                                <div class="payment-grid-content">
                                                     <p>ZIP</p>
                                                 <input type="number" id="zip" name="zip"  placeholder="Enter ZIP code" maxlength="5"inputmode="numeric">
                                                </div>
                                                
                                                
                                              
                                               
                                               
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                         <div class="sp-right">
                               
                                
                                    <div class="bd">

                                            <button>Apply Coupon</button>
                                        </div>
                                        <diV class="bill-1">
                                            <div class="bill">

                                                </div>

                                                </div>

                                                </div>
                                                <div class="bill-item">
                                                    <p>Total</p>
                                                    <span>₹4999</span>
                                                </div>
                                            </div>
                                        </div>
                                            

                                    </diV>
