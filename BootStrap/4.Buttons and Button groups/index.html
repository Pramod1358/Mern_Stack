<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours & Typography in Bootstrap 5</title>
    <!-- Bootstrap v5.3.3 CSS Link -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  </head>
  <body>
   <!-- Basic Buttons -->

   <h2>Basic Buttons</h2>
   <button class="btn btn-primary">Primary Btn</button>
   <button class="btn btn-info">Info Btn</button>
   <button class="btn btn-success">Success Btn</button>
   <button class="btn btn-danger">Danger Btn</button>
   <button class="btn btn-warning">Warning Btn</button>
   <button class="btn btn-light">Light Btn</button>
   <button class="btn btn-dark">Dark Btn</button>
   <button class="btn btn-link">link Btn</button>

   <br/>
   <hr/>
   <!-- anchor tags as btns -->

   <h2>anchor tags as btns</h2>

   <a href="#" class="btn btn-primary">primary Link as a btn</a>
   <a href="#" class="btn btn-info">info Link as a btn</a>
   <a href="#" class="btn btn-success">success Link as a btn</a>
   <a href="#" class="btn btn-danger"> danger Link as a btn</a>

   <br/>
   <hr/>


   <!-- buuton sizes -->

   <h2>button sizes</h2>

   <button class="btn btn-primary btn-sm">small sized button</button>
   <button class="btn btn-secondary btn-md">medium sized button</button>
   <button class="btn btn-dark btn-lg">large sized button</button>

   <br/>
   <hr/>

   <!-- outlined styles in buttons -->
    <h2>outlined styles in buttons</h2>
    <button class="btn btn-outline-primary">Button</button>
    <br/>
   <hr/>


   <!-- button groups -->
    <h2>button groups</h2>
   <div class="btn-group">
       <a href="#" class="btn btn-primary">primary button</a>
       <a href="#" class="btn btn-secondary">primary button</a>
       <a href="#" class="btn btn-dark">primary button</a>
       <a href="#" class="btn btn-danger">primary button</a>
   </div>

    <!-- Bootstrap v5.3.3 Bundle JS (Includes Popper.js automatically) -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
