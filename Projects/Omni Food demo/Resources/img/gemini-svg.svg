<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <!-- Icon: Interlocking Pin & Speed Fork -->
  <g transform="translate(15, 10)">
    <!-- Outer Connected Route Ring -->
    <path d="M 60,20 C 35,20 15,40 15,65 C 15,95 60,115 60,115 C 60,115 105,95 105,65 C 105,40 85,20 60,20 Z" 
          fill="none" stroke="#FF5722" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Node / Hub Point -->
    <circle cx="60" cy="60" r="12" fill="#FF5722"/>
    
    <!-- Speed Fork Silhouette in negative/contrast -->
    <line x1="53" y1="52" x2="53" y2="68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="52" x2="60" y2="68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="67" y1="52" x2="67" y2="68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="145" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#1A1F2C">
    NEXUS
  </text>
  <text x="147" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#FF5722">
    FOOD DELIVERY
  </text>
</svg>
